name: iOS TestFlight Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Public App Store version, such as 1.0.0
        required: true
        default: 1.0.0
        type: string
      build_number:
        description: App Store build number; increase after every successful upload
        required: true
        default: "1"
        type: string
      enable_pro_billing:
        description: Include RevenueCat purchases in this TestFlight build
        required: true
        default: false
        type: boolean
      upload_to_testflight:
        description: Upload the signed IPA after building it
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-testflight-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    environment: production
    env:
      APPLE_TEAM_ID: VH8ST3DJ5U
      IOS_BUNDLE_ID: com.getwiwi.app
      IOS_PROJECT_PATH: ios/App/App.xcodeproj
      IOS_SCHEME: App
      WIWI_VERSION_NAME: ${{ inputs.version_name }}
      WIWI_BUILD_NUMBER: ${{ inputs.build_number }}
      WIWI_ENABLE_PRO_BILLING: ${{ inputs.enable_pro_billing }}
      WIWI_UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
      NEXT_PUBLIC_SITE_URL: https://getwiwi.com
      NEXT_PUBLIC_NATIVE_API_ORIGIN: https://getwiwi.com
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_PRO_BILLING_ENABLED: ${{ inputs.enable_pro_billing && 'true' || 'false' }}
      NEXT_PUBLIC_REVENUECAT_IOS_API_KEY: ${{ secrets.NEXT_PUBLIC_REVENUECAT_IOS_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure temporary release paths
        run: |
          {
            echo "IOS_ARCHIVE_PATH=$RUNNER_TEMP/WIWI.xcarchive"
            echo "IOS_EXPORT_PATH=$RUNNER_TEMP/wiwi-export"
            echo "IOS_KEYCHAIN_PATH=$RUNNER_TEMP/wiwi-signing.keychain-db"
          } >> "$GITHUB_ENV"

      - name: Validate release inputs and secrets
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          if [[ ! "$WIWI_VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "version_name must contain two or three numeric components, such as 1.0.0." >&2
            exit 1
          fi

          if [[ ! "$WIWI_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "build_number must be a positive integer." >&2
            exit 1
          fi

          require_secret() {
            local secret_name="$1"
            local secret_value="$2"
            if [[ -z "$secret_value" ]]; then
              echo "Missing production environment secret: $secret_name" >&2
              exit 1
            fi
          }

          require_secret IOS_DISTRIBUTION_CERTIFICATE_BASE64 "$CERTIFICATE_BASE64"
          require_secret IOS_DISTRIBUTION_CERTIFICATE_PASSWORD "$CERTIFICATE_PASSWORD"
          require_secret IOS_PROVISIONING_PROFILE_BASE64 "$PROVISIONING_PROFILE_BASE64"
          require_secret NEXT_PUBLIC_SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL"
          require_secret NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"

          if [[ "$WIWI_UPLOAD_TO_TESTFLIGHT" == "true" ]]; then
            require_secret APP_STORE_CONNECT_API_KEY_ID "$API_KEY_ID"
            require_secret APP_STORE_CONNECT_API_ISSUER_ID "$API_ISSUER_ID"
            require_secret APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 "$API_PRIVATE_KEY_BASE64"
          fi

          if [[ "$WIWI_ENABLE_PRO_BILLING" == "true" ]]; then
            require_secret NEXT_PUBLIC_REVENUECAT_IOS_API_KEY "$NEXT_PUBLIC_REVENUECAT_IOS_API_KEY"
          fi

      - name: Verify Apple toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode_major="$(xcodebuild -version | awk '/^Xcode / { split($2, version, "."); print version[1] }')"

          if [[ -z "$xcode_major" || "$xcode_major" -lt 26 ]]; then
            echo "WIWI submissions require Xcode 26 or newer." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and sync native iOS project
        run: |
          npm run native:build
          npx cap sync ios

      - name: Install Apple signing credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          signing_directory="$RUNNER_TEMP/wiwi-signing"
          certificate_path="$signing_directory/distribution.p12"
          profile_path="$signing_directory/wiwi.mobileprovision"
          profile_plist="$signing_directory/profile.plist"
          keychain_password="$(uuidgen)"

          mkdir -p "$signing_directory"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 -D > "$profile_path"

          security create-keychain -p "$keychain_password" "$IOS_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$IOS_KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$IOS_KEYCHAIN_PATH"
          security import "$certificate_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$IOS_KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$IOS_KEYCHAIN_PATH"
          security list-keychains -d user -s \
            "$IOS_KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db"

          identities="$(security find-identity -v -p codesigning "$IOS_KEYCHAIN_PATH")"
          echo "$identities"
          if [[ "$identities" != *"Apple Distribution"* ]]; then
            echo "The certificate does not contain a valid Apple Distribution identity." >&2
            exit 1
          fi

          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"

          if [[ "$profile_team" != "$APPLE_TEAM_ID" ]]; then
            echo "The provisioning profile belongs to Apple team $profile_team, not $APPLE_TEAM_ID." >&2
            exit 1
          fi

          if [[ "$profile_app_id" != "$APPLE_TEAM_ID.$IOS_BUNDLE_ID" ]]; then
            echo "The provisioning profile is for $profile_app_id, not $APPLE_TEAM_ID.$IOS_BUNDLE_ID." >&2
            exit 1
          fi

          profiles_directory="$HOME/Library/MobileDevice/Provisioning Profiles"
          installed_profile="$profiles_directory/$profile_uuid.mobileprovision"
          mkdir -p "$profiles_directory"
          cp "$profile_path" "$installed_profile"

          {
            echo "IOS_PROFILE_NAME=$profile_name"
            echo "IOS_PROFILE_UUID=$profile_uuid"
            echo "IOS_INSTALLED_PROFILE=$installed_profile"
          } >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project "$IOS_PROJECT_PATH" \
            -scheme "$IOS_SCHEME"

      - name: Archive signed iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$IOS_PROJECT_PATH" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$IOS_ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            MARKETING_VERSION="$WIWI_VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$WIWI_BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $IOS_KEYCHAIN_PATH" \
            archive

      - name: Export signed IPA
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/ExportOptions.plist"

          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :destination string export" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string 'Apple Distribution'" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :manageAppVersionAndBuildNumber bool false" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :stripSwiftSymbols bool true" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$IOS_BUNDLE_ID string '$IOS_PROFILE_NAME'" "$export_options"

          xcodebuild \
            -exportArchive \
            -archivePath "$IOS_ARCHIVE_PATH" \
            -exportPath "$IOS_EXPORT_PATH" \
            -exportOptionsPlist "$export_options"

          ipa_path="$(find "$IOS_EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [[ -z "$ipa_path" ]]; then
            echo "Xcode completed without producing an IPA." >&2
            exit 1
          fi

          echo "IOS_IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Package release artifacts
        run: |
          set -euo pipefail
          artifact_directory="$RUNNER_TEMP/wiwi-artifacts"
          mkdir -p "$artifact_directory"
          cp "$IOS_IPA_PATH" "$artifact_directory/WIWI-$WIWI_VERSION_NAME-$WIWI_BUILD_NUMBER.ipa"
          ditto -c -k --sequesterRsrc --keepParent \
            "$IOS_ARCHIVE_PATH/dSYMs" \
            "$artifact_directory/WIWI-$WIWI_VERSION_NAME-$WIWI_BUILD_NUMBER-dSYMs.zip"

      - name: Retain signed IPA and debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: wiwi-ios-${{ inputs.version_name }}-${{ inputs.build_number }}
          path: ${{ runner.temp }}/wiwi-artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Upload build to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          api_keys_directory="$HOME/.appstoreconnect/private_keys"
          api_key_path="$api_keys_directory/AuthKey_$API_KEY_ID.p8"

          mkdir -p "$api_keys_directory"
          printf '%s' "$API_PRIVATE_KEY_BASE64" | base64 -D > "$api_key_path"
          chmod 600 "$api_key_path"

          if ! grep -q "BEGIN PRIVATE KEY" "$api_key_path"; then
            echo "The App Store Connect API private key is not a valid .p8 key." >&2
            exit 1
          fi

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IOS_IPA_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Remove signing material
        if: ${{ always() }}
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          if [[ -n "${IOS_INSTALLED_PROFILE:-}" ]]; then
            rm -f "$IOS_INSTALLED_PROFILE"
          fi

          if [[ -n "${API_KEY_ID:-}" ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"
          fi

          security delete-keychain "$IOS_KEYCHAIN_PATH" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/wiwi-signing"
