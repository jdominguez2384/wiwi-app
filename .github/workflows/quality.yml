name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://getwiwi.com
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static checks and tests
        run: npm run check

      - name: Build production app
        run: npm run build

  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: https://getwiwi.com
      NEXT_PUBLIC_NATIVE_API_ORIGIN: https://getwiwi.com
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Install dependencies
        run: npm ci

      - name: Build native web bundle
        run: npm run native:build

      - name: Sync Android project
        run: npx cap sync android

      - name: Compile Android debug APK and unsigned release bundle
        working-directory: android
        run: ./gradlew assembleDebug bundleRelease

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wiwi-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
