name: Android Release Bundle

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Public version name, such as 1.0.0
        required: true
        default: 1.0.0
        type: string
      version_code:
        description: Play Store build number; increase for every upload
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      NEXT_PUBLIC_SITE_URL: https://getwiwi.com
      NEXT_PUBLIC_NATIVE_API_ORIGIN: https://getwiwi.com
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Validate release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wiwi-upload-key.p12"

      - name: Install dependencies
        run: npm ci

      - name: Build native web bundle
        run: npm run native:build

      - name: Sync Android project
        run: npx cap sync android

      - name: Build signed Android App Bundle
        working-directory: android
        env:
          WIWI_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/wiwi-upload-key.p12
          WIWI_ANDROID_KEYSTORE_TYPE: PKCS12
          WIWI_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          WIWI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          WIWI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          WIWI_ANDROID_VERSION_NAME: ${{ inputs.version_name }}
          WIWI_ANDROID_VERSION_CODE: ${{ inputs.version_code }}
          WIWI_REQUIRE_RELEASE_SIGNING: "true"
        run: ./gradlew bundleRelease

      - name: Verify bundle signature
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: wiwi-android-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
